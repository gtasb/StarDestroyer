# generated by core/rulebase.py -- edit there, then: python -m core.rulebase
rules:
  - id: go-sqli-query
    mode: taint
    languages: [go]
    severity: ERROR
    options:
      interfile: true
    message: 外部输入流入 SQL 查询
    metadata:
      cwe: CWE-89
    pattern-sources:
      - pattern: '$R.URL.Query().Get(...)'
      - pattern: '$R.URL.Query()'
      - pattern: '$R.FormValue(...)'
      - pattern: '$R.PostFormValue(...)'
      - pattern: '$R.Header.Get(...)'
      - pattern: '$R.PathValue(...)'
      - pattern: 'mux.Vars($R)'
      - pattern: 'chi.URLParam(...)'
      - pattern: 'ioutil.ReadAll($R.Body)'
      - pattern: 'io.ReadAll($R.Body)'
      - pattern: '($C : *gin.Context).Query(...)'
      - pattern: '($C : *gin.Context).DefaultQuery(...)'
      - pattern: '($C : *gin.Context).Param(...)'
      - pattern: '($C : *gin.Context).PostForm(...)'
      - pattern: '($C : *gin.Context).GetHeader(...)'
      - pattern: '($C : *gin.Context).GetRawData()'
      - pattern: '($C : echo.Context).QueryParam(...)'
      - pattern: '($C : echo.Context).Param(...)'
      - pattern: '($C : echo.Context).FormValue(...)'
      - pattern: '($C : *fiber.Ctx).Query(...)'
      - pattern: '($C : *fiber.Ctx).Params(...)'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$DB.Query($Q)'
              - pattern: '$DB.Query($Q, $A, ...)'
              - pattern: '$DB.QueryRow($Q, ...)'
              - pattern: '$DB.Exec($Q, ...)'
              - pattern: '$DB.QueryContext($X, $Q, ...)'
              - pattern: '$DB.QueryRowContext($X, $Q, ...)'
              - pattern: '$DB.ExecContext($X, $Q, ...)'
              - pattern: '$DB.Prepare($Q)'
              - pattern: '$DB.PrepareContext($X, $Q)'
              - pattern: '$DB.Raw($Q, ...)'
              - pattern: '$DB.Where($Q, ...)'
              - pattern: '$DB.Order($Q)'
          - pattern-not: '($C : *gin.Context).Query(...)'
          - pattern-not: '($C : *fiber.Ctx).Query(...)'
          - pattern-not: '$R.URL.Query()'
          - focus-metavariable: '$Q'
    pattern-sanitizers:
      - pattern: 'strconv.Atoi(...)'
      - pattern: 'strconv.ParseInt(...)'
      - pattern: 'strconv.ParseUint(...)'
      - pattern: 'strconv.ParseBool(...)'
      - pattern: 'strconv.ParseFloat(...)'
      - pattern: 'uuid.Parse(...)'

