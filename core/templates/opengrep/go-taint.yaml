      - pattern: '($C : *fiber.Ctx).Params(...)'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'http.Get($U)'
              - pattern: 'http.Head($U)'
              - pattern: 'http.Post($U, ...)'
